server:
  port: ${JAVA_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: weknora-java
  datasource:
    url: ${JAVA_DB_URL:jdbc:postgresql://localhost:5432/weknora}
    username: ${JAVA_DB_USERNAME:weknora}
    password: ${JAVA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${JAVA_DB_POOL_SIZE:10}
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
weknora:
  jwt-secret: ${JWT_SECRET:}
  retrieve-driver: ${RETRIEVE_DRIVER:postgres}
  bridge:
    enabled: ${JAVA_GO_BRIDGE_ENABLED:false}
    url: ${JAVA_GO_BRIDGE_URL:http://127.0.0.1:8080}
    native-routes: ${JAVA_NATIVE_ROUTES_ENABLED:false}
